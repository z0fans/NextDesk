[package]
name = "nextdesk"
version = "1.0.94"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["json", "socks"] }
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
url = "2"
sys-locale = "0.3"
urlencoding = "2"
dirs = "6"
log = "0.4"
tokio-tungstenite = "0.26"
futures-util = "0.3"
ironrdp-rdcleanpath = "0.2.1"
der = { version = "0.7", features = ["alloc"] }
tokio-native-tls = "0.3"
native-tls = "0.2"
tokio-socks = "0.5"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = "2.4.5"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSPasteboard", "NSFilePromiseProvider", "NSPasteboardItem", "NSCursor", "NSEvent"] }
objc2-foundation = { version = "0.3.2", features = ["NSItemProvider", "NSArray", "NSData", "NSError", "NSProgress", "NSString", "NSURL", "block2"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_UI_Shell",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "nextdesk_lib"
crate-type = ["lib", "cdylib", "staticlib"]
