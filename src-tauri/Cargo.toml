[package]
name = "nextdesk"
version = "1.0.125"
edition = "2021"

[features]
default = []
nextdesk-native-rdp = ["ironrdp/cliprdr"]
kkterm-rdp = ["ironrdp/cliprdr"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
url = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
sys-locale = "0.3"
dirs = "6"
log = "0.4"
env_logger = "0.11"
tokio-tungstenite = "0.26"
futures-util = "0.3"
der = { version = "0.7", features = ["alloc"] }
tokio-native-tls = "0.3"
native-tls = "0.2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = "2.4.5"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2"
cpal = "0.17"
png = "0.17"
pollster = "0.4"
raw-window-handle = "0.6"
wgpu = "24"

smallvec = "1.15"
lz4_flex = "0.11"
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
tokio-util = "0.7"
tracing = { version = "0.1", features = ["log"] }
ironrdp = { version = "0.16", features = ["connector", "session", "graphics", "pdu", "input"] }
ironrdp-core = "0.2"
ironrdp-tokio = "0.9"
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(nextdesk_kkterm_rdp)'] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSPasteboard", "NSFilePromiseProvider", "NSPasteboardItem", "NSCursor", "NSEvent"] }
objc2-foundation = { version = "0.3.2", features = ["NSItemProvider", "NSArray", "NSData", "NSError", "NSProgress", "NSString", "NSURL", "block2"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_System_SystemInformation",
  "Win32_UI_Controls",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[lib]
name = "nextdesk_lib"
crate-type = ["lib", "cdylib", "staticlib"]

# Basic optimization for main crate in dev builds (loops, inlining)
# Without this, pixel extraction + LZ4 call in rdp_session.rs runs 5-10x slower
[profile.dev]
opt-level = 1

# Full optimization for hot-path dependency crates
[profile.dev.package.lz4_flex]
opt-level = 3
[profile.dev.package.ironrdp-session]
opt-level = 2
[profile.dev.package.ironrdp-graphics]
opt-level = 2
[profile.dev.package.ironrdp-pdu]
opt-level = 2
