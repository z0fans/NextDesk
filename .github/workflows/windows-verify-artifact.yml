name: Windows RDP Verify Artifact

on:
  push:
    branches:
      - codex/verify-rdp-windows
  workflow_dispatch:

env:
  HAS_TAURI_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
  VITE_NEXTDESK_RDP_ENGINE: kkterm-copy
  VITE_NEXTDESK_KKTERM_KEYBOARD_MODE: remote-scancode
  RUSTFLAGS: --cfg nextdesk_kkterm_rdp

jobs:
  windows-verify:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Checkout patched IronRDP
        shell: bash
        run: |
          git clone --no-tags https://github.com/Devolutions/IronRDP.git ../IronRDP
          git -C ../IronRDP checkout bf694c8a239d4cf53e7dd8edbe26f2aeb07bcf26
          git -C ../IronRDP apply "$PWD/patches/ironrdp-nextdesk.patch"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install locked dependencies
        run: npm ci && npm --prefix frontend ci

      - name: Run frontend quality gate
        shell: bash
        run: |
          npm --prefix frontend run lint
          npm --prefix frontend test -- --run
          npm --prefix frontend run build

      - name: Sanitize signing key
        if: ${{ env.HAS_TAURI_SIGNING_KEY == 'true' }}
        shell: bash
        run: |
          KEY=$(echo "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" | tr -d '\n\r')
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Disable updater artifacts without signing key
        if: ${{ env.HAS_TAURI_SIGNING_KEY != 'true' }}
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'src-tauri/tauri.conf.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.bundle = config.bundle || {};
          config.bundle.createUpdaterArtifacts = false;
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - name: Run Rust regression tests
        shell: bash
        working-directory: src-tauri
        run: |
          cargo fmt --all -- --check
          cargo test --locked --lib --features kkterm-rdp -- --nocapture

      - name: Build Windows verification package
        shell: pwsh
        run: |
          npm run tauri build -- --features kkterm-rdp --config src-tauri/tauri.windows.conf.json

      - name: List Windows bundle output
        shell: pwsh
        run: |
          Get-ChildItem -Recurse src-tauri\target\release\bundle | Select-Object FullName,Length

      - name: Upload Windows verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextdesk-windows-verify-${{ github.run_number }}-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/**
            src-tauri/target/release/bundle/msi/**
          if-no-files-found: error
