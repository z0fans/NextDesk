name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  MIHOMO_VERSION: v1.19.21

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: npm install && cd frontend && npm install

      - name: Download mihomo & geodata
        run: bash scripts/download-deps.sh universal-apple-darwin

      - name: Build & Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          args: --target universal-apple-darwin
          tagName: ${{ github.ref_name }}
          releaseName: "NextDesk ${{ github.ref_name }}"
          releaseBody: "See the assets below for download."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

  build-windows:
    needs: build-macos
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install && cd frontend && npm install

      - name: Download mihomo & geodata
        shell: bash
        run: bash scripts/download-deps.sh x86_64-pc-windows-msvc

      - name: Build & Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "NextDesk ${{ github.ref_name }}"
          releaseBody: "See the assets below for download."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
