name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  MIHOMO_VERSION: v1.19.21

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: npm install && cd frontend && npm install

      - name: Download mihomo & geodata
        run: bash scripts/download-deps.sh universal-apple-darwin

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          args: --target universal-apple-darwin
          includeUpdaterJson: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextdesk-macos-universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.tar.gz.sig

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install && cd frontend && npm install

      - name: Download mihomo & geodata
        shell: bash
        run: bash scripts/download-deps.sh x86_64-pc-windows-msvc

      - name: Trim signing key
        shell: pwsh
        run: |
          $key = "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}".Trim()
          echo "TAURI_SIGNING_PRIVATE_KEY=$key" >> $env:GITHUB_ENV

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          includeUpdaterJson: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextdesk-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.nsis.zip
            src-tauri/target/release/bundle/nsis/*.nsis.zip.sig

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | head -20

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.tar.gz
            artifacts/**/*.tar.gz.sig
            artifacts/**/*.nsis.zip
            artifacts/**/*.nsis.zip.sig

  publish-updater:
    needs: [release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate latest.json
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          REPO="z0fans/NextDesk"
          BASE="https://github.com/${REPO}/releases/download/${GITHUB_REF_NAME}"

          # Find signature files
          MAC_SIG=$(find artifacts -name '*.tar.gz.sig' | head -1)
          WIN_SIG=$(find artifacts -name '*.nsis.zip.sig' | head -1)
          MAC_SIG_CONTENT=$(cat "$MAC_SIG" 2>/dev/null || echo "")
          WIN_SIG_CONTENT=$(cat "$WIN_SIG" 2>/dev/null || echo "")

          # Find artifact names
          MAC_TAR=$(find artifacts -name '*.tar.gz' ! -name '*.sig' | head -1)
          WIN_ZIP=$(find artifacts -name '*.nsis.zip' ! -name '*.sig' | head -1)
          MAC_NAME=$(basename "$MAC_TAR")
          WIN_NAME=$(basename "$WIN_ZIP")

          cat > latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "Release ${GITHUB_REF_NAME}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${MAC_SIG_CONTENT}",
                "url": "${BASE}/${MAC_NAME}"
              },
              "darwin-x86_64": {
                "signature": "${MAC_SIG_CONTENT}",
                "url": "${BASE}/${MAC_NAME}"
              },
              "windows-x86_64": {
                "signature": "${WIN_SIG_CONTENT}",
                "url": "${BASE}/${WIN_NAME}"
              }
            }
          }
          EOF

      - name: Upload latest.json to release
        uses: softprops/action-gh-release@v2
        with:
          files: latest.json
