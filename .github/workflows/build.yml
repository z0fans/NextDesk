name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Build target for manual packaging tests'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - macos
          - macos-intel
          - windows

env:
  HAS_TAURI_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
  VITE_NEXTDESK_RDP_ENGINE: kkterm-copy
  VITE_NEXTDESK_KKTERM_KEYBOARD_MODE: remote-scancode
  RUSTFLAGS: --cfg nextdesk_kkterm_rdp

jobs:
  gateway-agent-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: gateway-agent/go.mod
          cache: false

      - name: Gateway Agent quality gate
        working-directory: gateway-agent
        run: go test ./...

  quality-gate:
    needs: gateway-agent-quality
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout patched IronRDP
        shell: bash
        run: |
          git clone --no-tags https://github.com/Devolutions/IronRDP.git ../IronRDP
          git -C ../IronRDP checkout bf694c8a239d4cf53e7dd8edbe26f2aeb07bcf26
          git -C ../IronRDP apply "$PWD/patches/ironrdp-nextdesk.patch"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install locked dependencies
        run: npm ci && npm --prefix frontend ci

      - name: Frontend quality gate
        run: |
          npm --prefix frontend run lint
          npm --prefix frontend test -- --run
          npm --prefix frontend run build

      - name: Rust quality gate
        working-directory: src-tauri
        run: |
          cargo fmt --all -- --check
          cargo test --locked --lib --features kkterm-rdp -- --nocapture

      - name: Patch hygiene
        run: git diff --check

  build-macos:
    needs: quality-gate
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos' }}
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Checkout patched IronRDP
        shell: bash
        run: |
          git clone --no-tags https://github.com/Devolutions/IronRDP.git ../IronRDP
          git -C ../IronRDP checkout bf694c8a239d4cf53e7dd8edbe26f2aeb07bcf26
          git -C ../IronRDP apply "$PWD/patches/ironrdp-nextdesk.patch"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install locked dependencies
        run: npm ci && npm --prefix frontend ci

      - name: Sanitize signing key
        if: ${{ env.HAS_TAURI_SIGNING_KEY == 'true' }}
        shell: bash
        run: |
          KEY=$(echo "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" | tr -d '\n\r')
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Disable updater artifacts without signing key
        if: ${{ env.HAS_TAURI_SIGNING_KEY != 'true' }}
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'src-tauri/tauri.conf.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.bundle = config.bundle || {};
          config.bundle.createUpdaterArtifacts = false;
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - name: Build & Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target universal-apple-darwin --features kkterm-rdp --config src-tauri/tauri.macos.conf.json
          tagName: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "NextDesk ${{ github.ref_name }}"
          releaseBody: "See the assets below for download."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: ${{ env.HAS_TAURI_SIGNING_KEY == 'true' }}

      - name: Upload candidate installers
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: nextdesk-macos-universal-${{ github.sha }}
          path: |
            src-tauri/target/**/bundle/**/*.dmg
            src-tauri/target/**/bundle/**/*.app.tar.gz
            src-tauri/target/**/bundle/**/*.exe
            src-tauri/target/**/bundle/**/*.sig
          if-no-files-found: error


  build-macos-intel:
    needs: quality-gate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.platform == 'macos-intel' }}
    runs-on: macos-13
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Checkout patched IronRDP
        shell: bash
        run: |
          git clone --no-tags https://github.com/Devolutions/IronRDP.git ../IronRDP
          git -C ../IronRDP checkout bf694c8a239d4cf53e7dd8edbe26f2aeb07bcf26
          git -C ../IronRDP apply "$PWD/patches/ironrdp-nextdesk.patch"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install locked dependencies
        run: npm ci && npm --prefix frontend ci

      - name: Sanitize signing key
        if: ${{ env.HAS_TAURI_SIGNING_KEY == 'true' }}
        shell: bash
        run: |
          KEY=$(echo "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" | tr -d '\n\r')
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Disable updater artifacts without signing key
        if: ${{ env.HAS_TAURI_SIGNING_KEY != 'true' }}
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'src-tauri/tauri.conf.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.bundle = config.bundle || {};
          config.bundle.createUpdaterArtifacts = false;
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - name: Build & Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target x86_64-apple-darwin --features kkterm-rdp --config src-tauri/tauri.macos.conf.json
          tagName: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "NextDesk ${{ github.ref_name }}"
          releaseBody: "See the assets below for download."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: ${{ env.HAS_TAURI_SIGNING_KEY == 'true' }}

      - name: Upload candidate installers
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: nextdesk-macos-intel-${{ github.sha }}
          path: |
            src-tauri/target/**/bundle/**/*.dmg
            src-tauri/target/**/bundle/**/*.app.tar.gz
            src-tauri/target/**/bundle/**/*.exe
            src-tauri/target/**/bundle/**/*.sig
          if-no-files-found: error


  build-windows:
    needs: [quality-gate, build-macos]
    if: >-
      ${{
        always()
        && needs.quality-gate.result == 'success'
        && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows')
        && ((github.event_name == 'workflow_dispatch' && inputs.platform == 'windows') || needs.build-macos.result == 'success')
      }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Checkout patched IronRDP
        shell: bash
        run: |
          git clone --no-tags https://github.com/Devolutions/IronRDP.git ../IronRDP
          git -C ../IronRDP checkout bf694c8a239d4cf53e7dd8edbe26f2aeb07bcf26
          git -C ../IronRDP apply "$PWD/patches/ironrdp-nextdesk.patch"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install locked dependencies
        run: npm ci && npm --prefix frontend ci

      - name: Run Windows Rust regression tests
        shell: pwsh
        working-directory: src-tauri
        run: cargo test --locked --lib --features kkterm-rdp -- --nocapture

      - name: Sanitize signing key
        if: ${{ env.HAS_TAURI_SIGNING_KEY == 'true' }}
        shell: bash
        run: |
          KEY=$(echo "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" | tr -d '\n\r')
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Disable updater artifacts without signing key
        if: ${{ env.HAS_TAURI_SIGNING_KEY != 'true' }}
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'src-tauri/tauri.conf.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.bundle = config.bundle || {};
          config.bundle.createUpdaterArtifacts = false;
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - name: Preflight Windows build log
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cmd /c "npm run tauri build -- --features kkterm-rdp --config src-tauri/tauri.windows.conf.json > windows-tauri-build.log 2>&1"
          $exitCode = $LASTEXITCODE
          Get-Content windows-tauri-build.log
          if ($exitCode -ne 0) {
            if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref }}" -like "refs/tags/*") {
              gh release upload "${{ github.ref_name }}" windows-tauri-build.log --clobber
            }
            exit $exitCode
          }

      - name: Upload failed Windows build log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: nextdesk-windows-build-log-${{ github.sha }}
          path: windows-tauri-build.log
          if-no-files-found: ignore

      - name: Build & Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --features kkterm-rdp --config src-tauri/tauri.windows.conf.json
          tagName: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "NextDesk ${{ github.ref_name }}"
          releaseBody: "See the assets below for download."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: ${{ env.HAS_TAURI_SIGNING_KEY == 'true' }}

      - name: Upload candidate installers
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: nextdesk-windows-${{ github.sha }}
          path: |
            src-tauri/target/**/bundle/**/*.dmg
            src-tauri/target/**/bundle/**/*.app.tar.gz
            src-tauri/target/**/bundle/**/*.exe
            src-tauri/target/**/bundle/**/*.sig
          if-no-files-found: error
