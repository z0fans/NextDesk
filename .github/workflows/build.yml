name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  MIHOMO_VERSION: v1.19.21

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Checkout patched IronRDP
        shell: bash
        run: |
          git clone --no-tags https://github.com/Devolutions/IronRDP.git ../IronRDP
          git -C ../IronRDP checkout bf694c8a239d4cf53e7dd8edbe26f2aeb07bcf26
          git -C ../IronRDP apply "$PWD/patches/ironrdp-nextdesk.patch"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: npm install && cd frontend && npm install

      - name: Download mihomo & geodata
        run: bash scripts/download-deps.sh universal-apple-darwin

      - name: Sanitize signing key
        run: |
          KEY=$(echo "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" | tr -d '\n\r')
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Build & Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target universal-apple-darwin --config src-tauri/tauri.macos.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: "NextDesk ${{ github.ref_name }}"
          releaseBody: "See the assets below for download."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

  build-windows:
    needs: build-macos
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Checkout patched IronRDP
        shell: bash
        run: |
          git clone --no-tags https://github.com/Devolutions/IronRDP.git ../IronRDP
          git -C ../IronRDP checkout bf694c8a239d4cf53e7dd8edbe26f2aeb07bcf26
          git -C ../IronRDP apply "$PWD/patches/ironrdp-nextdesk.patch"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install && cd frontend && npm install

      - name: Download mihomo & geodata
        shell: bash
        run: bash scripts/download-deps.sh x86_64-pc-windows-msvc

      - name: Sanitize signing key
        shell: bash
        run: |
          KEY=$(echo "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" | tr -d '\n\r')
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Build & Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --config src-tauri/tauri.windows.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: "NextDesk ${{ github.ref_name }}"
          releaseBody: "See the assets below for download."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
