<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NextDesk</title>
    <script>
      // Sync theme before React renders to prevent flash
      (function() {
        var saved = localStorage.getItem('nextdesk-theme');
        if (saved === 'light') {
          document.documentElement.classList.remove('dark');
        } else if (saved === 'auto' || !saved) {
          // Auto mode: determine by local time (7:00-19:00 = light)
          var hour = new Date().getHours();
          if (hour >= 7 && hour < 19) {
            document.documentElement.classList.remove('dark');
          }
          // Otherwise keep dark (HTML default)
        }
        // If saved === 'dark', keep the HTML default class="dark"
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
